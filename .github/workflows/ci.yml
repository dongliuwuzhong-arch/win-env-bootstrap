name: ci

# dsh-env-bootstrap 的 CI：契约测试 + 语法 + 只读自检。
# 绝不跑 bootstrap -Apply —— 那会真装软件、真改 PATH，CI 机器不该被改。
#
# 路径说明：本文件放在技能目录内（<skill>/.github/workflows/ci.yml）。
#   - 技能目录本身是仓库根时：SKILL_ROOT = .
#   - 把它挪到 <repo>/.github/workflows/ci.yml 时：SKILL_ROOT = .agents/skills/dsh-env-bootstrap
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  SKILL_ROOT: .

jobs:
  windows:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
        node: ['24']
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Node 版本自检
        run: node --version

      # Node 22+ 把 --test 的位置参数当 GLOB，不是目录。
      # 'node --test tests/' 会报 Could not find，必须用 glob。
      - name: 契约测试（node --test）
        run: |
          Set-Location $env:SKILL_ROOT
          node --test 'tests/**/*.test.mjs'

      # Pester 直测 bootstrap.ps1 的函数 + 幂等收敛契约。装 Pester 5 要先引导
      # NuGet provider（无头会撞 ShouldContinue 空引用），且必须 -ExecutionPolicy
      # Bypass（runner 上 AllSigned 会拒载未签名测试文件）。
      - name: Pester（bootstrap.ps1 函数直测 + 幂等收敛）
        # 显式用 Windows PowerShell 5.1：bootstrap 层就是 5.1 的世界（BOM/ANSI 陷阱
        # 只在 5.1 里复现），且 5.1 的 PowerShellGet 1.0 需要下面的 NuGet provider 引导。
        shell: powershell
        run: |
          Set-Location $env:SKILL_ROOT
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.0
          # 判据必须读结果对象：Invoke-Pester 是 cmdlet 不设 $LASTEXITCODE，
          # Pester 5/6 的 -CI 语义也不同——按退出码判拿到的是环境残留，红绿都会判反（code-audit #1）
          $r = Invoke-Pester -Path tests-ps -CI -PassThru
          if ($r.FailedCount -gt 0) {
            Write-Host "::error::Pester 失败 $($r.FailedCount) 例"
            exit 1
          }
          exit 0

      - name: 语法检查（node --check）
        run: |
          Set-Location $env:SKILL_ROOT
          $files = @(Get-ChildItem -Path scripts -Recurse -File -Include '*.mjs', '*.js')
          $files += @(Get-ChildItem -Path tests -File -Filter '*.mjs')
          $bad = 0
          foreach ($f in $files) {
            node --check $f.FullName
            if ($LASTEXITCODE -ne 0) {
              $bad++
              Write-Host "::error file=$($f.Name)::node --check failed"
            }
          }
          Write-Host "node --check: $($files.Count) file(s), $bad failed"
          if ($bad -gt 0) { exit 1 }

      - name: 语法检查（PowerShell Parser）
        run: |
          Set-Location $env:SKILL_ROOT
          $bad = 0
          foreach ($f in @('scripts/bootstrap.ps1', 'scripts/smoke.ps1')) {
            $errs = $null
            $full = (Resolve-Path -LiteralPath $f).Path
            [void][System.Management.Automation.Language.Parser]::ParseFile($full, [ref]$null, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) {
              $bad++
              foreach ($e in $errs) {
                Write-Host "::error file=$f,line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            } else { Write-Host "parser ok: $f" }
          }
          if ($bad -gt 0) { exit 1 }

      # 只读：-Check 不装任何东西。
      # 0 = 无缺口 / 1 = 有硬缺口（CI 机器没装 DSH 本体，属正常）/ 其它 = 脚本自己崩了。
      #
      # 每步末尾必须显式 exit：GH 的 pwsh/powershell 包装器会在步骤末尾追加
      # exit $LASTEXITCODE，不封尾就会把 bootstrap 的合法退出码 1 漏给步骤，
      # 断言明明通过也判红（2026-11-19 的 12 连红就是这个）。
      - name: bootstrap -Check（只读，断言退出码）
        run: |
          Set-Location $env:SKILL_ROOT
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap.ps1 -Check
          $code = $LASTEXITCODE
          Write-Host "bootstrap -Check exit = $code"
          # 契约是 0 全过 / 1 有硬缺口 / 2 仅提醒，三个都合法
          if ($code -notin 0,1,2) {
            Write-Host "::error::bootstrap -Check 退出码 $code，不在 0/1/2 里（脚本自己崩了）"
            exit 1
          }
          exit 0

      # 本地一键冒烟也在 CI 里跑一遍：保证这条入口不是只在作者机器上能跑。
      - name: smoke.ps1（一键冒烟）
        run: |
          Set-Location $env:SKILL_ROOT
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke.ps1
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::error::smoke.ps1 退出码 $code"
            exit 1
          }
          exit 0
